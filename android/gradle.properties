org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Keep the Kotlin compile daemon small; by default it inherits the Gradle daemon's -Xmx
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m
# The separate Kotlin daemon keeps failing to start/connect on this machine.
# Compile Kotlin inside the Gradle daemon instead.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

kotlin.incremental=false